# 东汉古韵机器人配置
# Linux/Jetson 可填设备名（按 arecord/aplay 解析）；Windows 按名称匹配，找不到时回退系统默认设备

audio:
  # 麦克风：设备名子串匹配。Linux 自动解析 ALSA 卡号；Windows 使用 PortAudio 设备名
  # ——USB 声卡的 ALSA 卡号每次重启都会漂移，写死 plughw:C,D 会失效。
  # 需要强制指定时可写 plughw:<card>,<device>（显式前缀，原样使用）。
  capture_device: USB Audio
  # 扬声器：设备名子串匹配。Windows 可选择输出设备，自动模式跟随系统默认。
  # Linux：日常播放走 PipeWire 默认输出（蓝牙等），此值仅作 pw-play
  # 失败时的 aplay 直连回退。Windows 则用于选择输出设备的名称匹配。
  playback_device: USB Audio
  sample_rate: 16000

session:
  max_turns: 8        # 保留最近 8 轮对话

voice:
  default_mode: natural   # natural | ancient（可用 m 键运行时切换）
  pitch: 130              # 古韵合成基频（Hz）

asr:
  backend: local        # local = Vosk 本地模型；云端接口见 services/asr_client.py
